<body>
    <h1>媽祖靈籤-Sn生活文創館</h1>
    <div id="container">
        <button onclick="drawSign()">抽籤</button>
        <div id="sign"></div>
        <button id="zhiButton" onclick="zhiJiao()" style="display: none;">擲筊確認</button>

        <div id="explanation" style="display: none;"></div>
    </div>
    <script>
        const signs = [
            { number: 1, poem: '日出便見風雲散，<p>光明清靜照世間，<p>一向前途通大道，<p>萬事清吉保平安。', story: '包公請雷驚仁宗 包極審張世真', explanation: '只要太陽一出來，一切就會雲散，只要光明一普照，世間便見清淨太平，前途是光明正大，只要努力前進，正是條條大路通長安，只要做事問心無愧，神明自會保佑您，萬事清吉平安。抽到此籤謀望難成，求財交易，獲利不多。問功名，有志竟成。問婚姻，有情人終成眷屬。<p>凡事大吉昌。作事難成，成者大吉。家事無憂。家運平安大吉。求財先大進後小利。婚姻允成。求兒大吉。六甲頭胎男，二胎女。功名望後有成。尋人得回。遠信速至。失物在東急尋能還。歲君清吉。出外平安。經商如意。行舟有大財。移居得安。治病未日（月半）痊安。求雨尚未。官事理斷分明。耕作得利。築室清吉。墳墓地穴大吉。來人月光在。討海漸漸得利。作塭大吉利。魚苗不畏。月令遂意。六畜好。' },
            { number: 2, poem: '於今此景正當時，<p>看看欲吐百花魁，<p>若能遇得春色到，<p>一洒清吉脫塵埃。', story: '陳東初祭梅得救 趙子龍救阿斗 薛交薛癸旁州遇採樓得繡球', explanation: '冬天到了，春天還會遠嗎？看看周圍的景色多美，百花正在含苞待放，嬌豔欲滴；只要春光一到，立刻會有一番氣象，正應了「是春到碧桃枝上，花發滿城錦繡，鶯歌綠柳樓前，春生大地文章。」<p>問事求謀 ,正是困難時期，只要能夠多求神佈施增加福份，努力向上, 緊接而來的，必是一帆風順。故一個人做事不要怕失敗，一定要更加努力必能東山再起。<p>問功名，希望不大，好好充實自己，等待秋天再進。<p>問婚姻，就像百花盛開定有好消息傳來。<p>問疾病， 老幼婦人危險宜消災。<p>凡事春天到。作事春成美，冬不佳。家事必得進益。家運福祉茂盛。婚姻永偕伉儷。求兒適宜。六甲生男。求財如泉湧（先有後無）。功名二次成。秋進連中。歲君中和。治病老不好。少平安。出外春夏好，秋冬呆。來人南方。行舟有大財。移居平平（不可）。失物謹尋在，遲者無。求雨甲子日得有。官事完局。六畜興旺大利。耕作春季如意。築室大吉。墳墓光前裕後。討海春有冬無。作塭可慶獲利。魚苗大利。月令不畏。尋人南方。遠信春天到。' },
            { number: 3, poem: '勸君把定心莫虛，<p>天註衣祿自有餘，<p>和合重重常吉慶，<p>時來終遇得明珠。', story: '沈萬三掘寶與正德君鬥法', explanation: '奉勸你不要再三心兩意了，姻緣天註定，是不能勉強的，俗謂「有緣千里來相會，無緣對面不相識。」婚姻是上天所註定的，好的姻緣是上天成全的，緣份一到，你一定會遇到你要尋覓的「明珠」。<p>• 暗示遇貴人後 事可成，目前問事求謀難成 , 信心不足易患得患失 .<p>• 若問婚姻，須有專情，緣份一到，自然有情人終成眷屬。<p>• 問事業，當事人要有定性，遇到挫折必定要自我檢討後再接再厲，定能成功.<p>• 問願望: 不可見異思遷 ,如果受到一些挫折，就放棄不做，就永無成功之日。<p>• 問求財出外有小利。<p>• 問功名，一定要更加努力。問移居可得安康。<p>• 問疾病，病況不穩，祈神消災不畏。<p>• 凡事吉。作事二次成。家事餘興且喜。家運和氣，後得祥瑞。婚姻大吉。求兒吉。六甲先男後女。求財後遇貴人大興。功名後科連登，尾有。歲君安和。治病命不畏，平安。出外向南方遇貴人。經商先利平，後大財。來人立即到。行舟漸得大財。移居得安。失物月光必在。求雨過日自有。官事不畏，破財，完局。六畜可納。耕作下冬好。築室大吉。墳墓永裕後崑。討海晚有大利。作塭和者必獲厚利。魚苗後得大利。月令漸得春風。尋人得回。遠信守候佳音。<p>• 古人：朱德武入寺相分明 摧文德胡鳳嬌到家空成婚' },
            { number: 4, poem: '風恬浪靜可行舟，<p>恰是中秋月一輪，<p>凡事不須多憂慮，<p>福祿自有慶家門。', story: '廬龍王次子招親', explanation: '風平浪靜，船行一帆風順，正像中秋明月，圓滿皎潔。凡事不必多憂慮，福祿是天定的，時來運轉，自然喜氣盈門。<p>• 【求得此籤】<p>• 暗示不該好高騖遠也無須作無謂的憂慮，應該以平常心去過生活。<p>• 目前福報平平，問事求謀難成 , 機緣未到時易憂心煩惱，如果是應考之人，是金榜題名的好兆頭。<p>• 問訴訟，表示要走的正。<p>• 問婚姻，表示和諧美滿。<p>• 問移居，一切順利安康。<p>• 問疾病，祈神消災近日痊癒。<p>• 凡事成者大吉。作事有成。家事綿綿齊輝。家運大獲吉昌。婚姻和諧，月半成。求兒好。六甲先男後女。求財在家好，出外凶。功名顯祖榮宗。歲君平安。治病近日痊癒。出外求財求事如意。經商大吉利。來人即到。行舟風平，大吉。移居可慶。失物月光在。求雨月末即到。官事破財。求貴人解。六畜興盛。耕作有收。築室門庭興旺。墳墓可得瑞氣。討海有大財。作塭有望。魚苗月光好。月令好。尋人快遇。遠信遲到。<p>• 古人：盧龍王次子招親 ▽趙子龍救阿斗' },
            { number: 5, poem: '只恐前途命有變，<p>勸君作急可宜先，<p>且守長江無大事，<p>命逢太白守身邊。', story: '王翦大戰袁遠', explanation: '此去前途恐怕會有變故，勸你莫著急，不必事事都想要搶得先機。暫時守在長江邊等待機會，命裏有太白金星保佑你。自然不會有什麼大事發生。<p>這首籤詩暗示做事須有先見之明，<p>不可燥進魯莽行事，以免造成不必要的變化。<p>並且多禮佛增福來獲得神佛的庇護。<p>【求得此籤】<p>問事求謀不宜急進，所謂欲速則不達，且須等待時機。<p>問婚姻，對方可能有意中人，成功希望不大。<p>問訴訟，和解為宜。問功名，有希望。<p>求財平平，事業宜按步就班，不可好高騖遠。<p>問遷移或變動職位，不吉。<p>總之，不妄動，求神化解自保安泰。<p>問疾病，宜消災。地有陰邪，男無妨女危險<p>凡事待時機。作事顛倒。前凶後吉。家事有貴人，團圓。家運先被邪。後吉祥。婚姻多口舌，不吉。求兒不佳。六甲頭胎生女次生男（先女后女）。求財以待時來（不吉）。功名必遇，防徼。歲君平安。治病月光癒，暗不吉。出外下半年好。經商先利，後遇貴人。來人遲後到。行舟出外有風波災。移居不好。失物謹尋在，遲即無。求雨朝夕即有，官事宜和拖尾（被官欺，后完明）。六畜不祥。耕作內有不足。築室不吉。墳墓先平後得佳氣。討海邪病先輕後好。作塭先難後得。魚苗先無後有。月令淡淡。尋人待慢。遠信必阻遲至<p>古人：王剪戰袁達 韓文公過秦嶺遇霜雪凍' },
            { number: 6, poem: '風雲致雨落洋洋，<p>天災時氣必有傷，<p>命內此事難和合，<p>更逢一足出外鄉。', story: '劉智遠戰瓜精', explanation: '風起雲湧起變化，鋒面來襲招來暴風雨，大雨下個不停。天然的災難，氣候的變化，造成了地球上的災害。ㄧ個人命中如果註定沒有這些東西，無論如何強求，也得不到圓滿的結果。既然沒有希望，就是拼命向外奔走謀求，也是白費功夫。<p>【求得此籤】 <p>求得此籤暗示目前福報不佳，<p>問事求謀拖尾難成 . <p>問求財，無希望，勿去強求。 <p>問訴訟，宜和解，莫逞強。<p>問婚姻，另找對像問遷移，不可妄動。<p>問疾病，宜消災 . 地有陰邪 , 老幼危險。 <p>• 凡事待望。作事不成局。家事家庭相爭。家運有怪必防。婚姻不宜。求兒不可。六甲男高貴，晚投枝。求財空有。功名難望。歲君破財。月令不吉。治病邪作病，險不吉。出外無貴人。經商財本耗散。來人月光即到。行舟不好。移居且慢。失物運如此。路難逢。求雨不到則久。官事賠錢，拖尾。六畜不佳。耕作無收。築室犯凶星。墳墓地運不佳。討海邪祟不利。作塭失利。魚苗失利了錢。月令不遂。尋人遲遇。遠信無望。 <p>• 古人：烏精亂宋朝 烏有作鳥 ' }, // placeholder for the rest
            { number: 7, poem: '雲開月出正分明，<p>不須進退問前程，<p>婚姻皆由天註定，<p>和合清吉萬事成。', story: '鄂國公暗察白袍將', explanation: '雲開月出，大放光明，不須再問進退，可以直奔向前程，婚姻皆由天註定好的，只要是天作之合，一定美滿，【求得此籤】<p>暗示目前福報尚有不足，問事求謀多慮舉棋不定，<p>宜多求觀音菩薩祈福可得圓滿。<p>如果是問運途，可以說是「否極泰來」，即厄運已過，現在已漸入好運了。<p>問婚姻，表示佳偶天成，有情人終成眷屬。<p>此籤問做事，可以成功。<p>問求財，開始見利。<p>問出外移居，則不利。<p>問訴訟，和解可無事。<p>問疾病，宜消災，幼危險。<p>• 凡事後成。作事月光成。家事冒險，平安。家運漸漸平安。婚姻月光成。暗不成。求兒好。六甲定必生女。求財有成。功名少有成，老無。歲君好。治病女平，男晚好，少險，老不畏。出外滿路異香。經商成者大吉。來人月中到。行舟須當先防。移居不吉。失物月光在，月暗無。求雨初無，月尾有。官事破財，完局。六畜興旺。耕作有收。築室月中好。墳墓地勢甚美。討海合和吉，不合凶。作塭須防風水。魚苗月中吉。月令淡淡。尋人月中遇。遠信可喜。<p>• 古人：國公暗察白袍將。國察有作包訪。尉遲恭掛帥。' },
            { number: 8, poem: '禾稻看看結成完，<p>此事必定兩相全，<p>回到家中寬心坐，<p>妻兒鼓舞樂團圓。', story: '薛仁貴回家', explanation: '看看田裡結成了稻穗，知道今年又豐收了，辛勤的耕耘，必有豐盛的收穫，這事是兩相關的，看到好的收成，心中多高興，回到家裡，來跟妻兒們同在一起，快快樂樂地跳舞一番，這首詩是很好的籤詩，昔日的流汗，今天總看到豐滿的收成了，如果沒有昔日的流汗，那有今天的收成呢<p>【求得此籤】 <p>暗示目前福報俱足，問事求謀大抵先苦後甘，先否後泰。<p>問婚姻，表示有情人終成眷屬。<p>問事業，要腳踏實地去做，不可投機，投機必敗。<p>問功名，如在秋天，有希望，如在冬天，須待明年.<p>問疾病，宜消災 , 老危險。<p>• 凡事和者得，不和失。作事先難後興。家事進益團美。家運平安。婚姻成，大吉，兩全其美。求兒吉。六甲先男後女。求財下半年好。家利。功名二次得進。歲君和氣。治病少不畏，老不好。出外不可。經商有利必得。來人速到。行舟得財。移居大吉。失物速尋必在。求雨月尾即有。官事二次完明，破財。六畜大吉。耕作下半年有收成。築室居中。墳墓地運有合。討海好。作塭允收。魚苗大利。月令破財，下年不畏。尋人速至。遠信速至。<p>• 古人：薛仁貴回家。朱并回家。' },
            { number: 9, poem: '龍虎相隨在深山，<p>君爾何須背後看，<p>不知此去相愛愉，<p>他日與我卻無干。', story: '龍虎爭鬥', explanation: '位極尊貴的龍和雄霸山林的猛虎，彼此相偕住在深山裏，你我何必互相猜忌顧慮，勾心鬥角，表面看是一種你儂我儂，互相愛愉的形為，乃是一種錯誤的決定，恐怕他日，會越行越遠，變成你我互不相干的局面，如同陌生人一般。<p>暗示當事人福報不佳，問事求謀拖尾難成。<p>兩個志趣不合的人，勉強在一起，一定無法持久。<p>所以如果問婚姻，是難白頭偕老之兆。<p>問合夥生意，最後會拆夥，而且恐怕會鬧得不愉快。<p>問謀事，因競爭的人太多，恐怕難如意。<p>問求財，問功名，都是一樣，很難有成。<p>移居，出外旅行、變動職位，都不吉，宜靜，不宜妄動。<p>問疾病，有陰邪元辰暗淡，老人及婦女危險，宜求神消災解厄。<p>• 凡事謹慎。作事守己安分。家事無有際會。家運有邪，難安。婚姻不可。求兒切要不可。六甲子媳虛。求財無益。功名不取。歲君不吉。治病深危，寅辰日過不畏。出外不可。經商了錢。來人未日（半月）到。行舟不美。移居不佳。失物難尋。求雨尚未，自有。官事不可，破財。六畜不可納。耕作無收，白做。築室且慢也可。墳墓地勢適當。討海有犯邪祟。作塭了工蝕本。魚苗了錢。月令破財有口舌。尋人漸回。遠信無望。<p>• 古人：龍虎爭鬥（龍虎相會）' },
            { number: 10, poem: '花開結子一半枯，<p>可惜今年汝虛度，<p>漸漸日落西山去，<p>勸君不用向前途。', story: '岳飛掠秦檜', explanation: '花開花落，結果卻是一半落空，收穫不多，可惜今年的光陰算是虛度了，太陽漸漸西落去，俗語云：「夕陽無限好，只是近黃昏」所以奉勸你，還是回鄉腳踏實地，努力工作，不要好高騖遠，不求實際，在外邊疲於奔命勞累呀！<p>【求得此籤】<p>暗示目前福報平平 .<p>問事求謀事倍功半 . 只宜守成 .<p>問出外，空勞往返，所以不吉。<p>問婚姻，因籤有結子一半枯，今年汝虛渡之句，恐怕難成。<p>移居、變動職位，均不吉。<p>問疾病， 元辰暗淡有五鬼陰邪作祟，老幼危險宜消災。<p>• 凡事拖尾。難解難脫。作事難成。家事恐防短壽。家運難安。婚姻難成。求兒不可。六甲子難得。求財上半年空破財，九月過不畏。功名枉費，難得。歲君不順。治病月半安月尾死。出外不可。經商不好賠錢。來人月底間。行舟謹慎無害。移居不允。失物難尋。求雨朝夕即到。官事不好，破財。六畜不吉。耕作五分平平。築室有災星。墳墓地犯退敗，必遷。討海全無，不好。作塭無望，蝕本。魚苗得失。月令難通。尋人月尾回。遠信難至。<p>• 古人：岳飛掠秦檜。奉吟受災。' },
            { number: 11, poem: '靈雞漸漸見分明，<p>凡事且看子丑寅，<p>雲開月出照天下，<p>郎君即便見太平。', story: '韓文公過秦嶺湘子掃霜雪', explanation: '靈雞一啼，天漸漸亮了，凡事就看明天吧，雲開月出，光照天下，你便可看到太平景象了<p>【求得此籤】<p>暗示目前福報尚有不足 . 問事求謀 ,宜求觀音菩薩祈福可得圓滿 .問做事求財，可以說漸漸有希望。<p>這首籤詩是苦盡甘來之兆，所以問功名，表示你十年寒窗，有出頭的日子了。問婚姻，表示有情人終成眷屬。 <p>移居平安，出外可行。<p>問疾病， 病情加重 ,元辰暗淡 ，有五鬼陰邪作祟 病拖尾，宜消災。<p>凡事作不和，子錢安。作事子丑寅日必成。家事平好。家運漸漸得居春風。婚姻終成。求兒不可。六甲先男，貴氣（子媳缺）。求財漸漸有收。功名費了工，八月好。歲君順吉。治病大命不好，子丑寅日過不畏。出外子丑寅日可行。經商不利。來人近日到。行舟不可。移居平安（子丑寅日抽好）。失物子丑寅日尋在。求雨近有。官事有人和吉，三月完局。六畜可納。耕作半收。築室好。墳墓平平。討海前呆后微。作塭小收微利。魚苗小利。月令不畏。尋人牛虎日。遠信牛虎日。 <p> • 古人：韓文公過秦嶺湘子掃霜雪。高求楊戩當權。 ' },
            { number: 12, poem: '長江風浪漸漸靜，<p>于今得進可安寧，<p>必有貴人相扶助，<p>凶事脫出見太平。', story: '桃花女流勿太歲', explanation: '長江的風浪漸漸平靜了，現在船隻可以前進，並且可以安寧無事了，只要積極前進，一定會有貴人來相助，即使遇到困境也能逢凶化吉，化險為夷。<p>【求得此籤】 <p>求得此籤暗示目前福報 平平， <p>問事求謀先凶後吉，遇貴人才有逢凶化吉之兆。 <p>如有困難，現在慢慢可以化解，不必憂慮，否極泰來，風浪終會過去的。 <p>一生貴人多助，所以常能逢凶化吉。 <p>移居出外旅行，均吉，如問訴訟，可逢貴人而化平安。<p>問功名，有貴人提拔之兆。 <p>問婚姻，只要謀人出面，婚姻可成。 <p>問疾病， 老危險宜求神消災解厄。 <p>凡事月光好。作事進行有利。家事光耀門閭。家運漸安。婚姻可合成者吉。 求兒吉。六甲先男高貴。求財好運，得意。功名難得。歲君順吉。治病月光好，老不痊。出外有貴人扶。經商大吉。來人近日到。行舟大吉。移居平正。失物急尋在，遲難尋。求雨遠。官事了錢。求貴人脫。六畜可納。耕作平平。築室慢即可。墳墓地勢有合。討海微利后有。作塭漸得如意。魚苗中有利。月令破財不遂。尋人近日。遠信速至。 <p>• 古人：智遠戰瓜精　劉志遠戰瓜精。(劉志遠投軍)桃花女流勿太歲。' },
            { number: 13, poem: '命中正逢羅孛關，<p>用盡心機總未休，<p>作福問神難得過，<p>恰是行舟上高灘。', story: '撐渡伯行船遇太歲', explanation: '你的命理八字中，正遇到「羅睺與孛星」，這種極凶煞惡星，雖然你用盡心機也避免不了，就是求神庇佑亦只能較輕微，不能完全躲過去，正如行駛船隻，遇蹈沙灘，進退不了，仰天長嘆。 <p>【求得此籤】 <p>暗示目前福報不好，正處於進退維谷的時候，<p>問事求謀不可 ,問出外移居，不吉。老年人求得此籤暗示，表示一生白費心機，老來已無甚希望。 <p>若年輕人 求得此籤暗示，不必難過，這正是考驗你的時刻，只要能克服困難，自有光明前途。 <p>問功名，要充實你自己，目前希望不大。問婚姻，緣份未到恐難成功，不宜勉強。<p>問疾病，犯太歲者謹防意外, 病慎醫治，少年人尚無礙，若老年人，則有陰邪元辰暗淡，宜求神消災解厄。<p>• 凡事不吉。作事先難後興。家事門庭起風波。家運人不安，邪作祟。婚姻難合。求兒不可。六甲臨產危險。求財犯活鬼，下年無。功名費工，望後得進。歲君淡淡（凶事不美）。治病犯（太歲）必死，未不畏。外不可。經商失運。來人難望。行舟不順，失利。移居不可。失物錢難尋，未日（半月）在。求雨近日無。官事大呆。六畜不吉。耕作小收，不利。築室犯災星。墳墓地勢不吉。討海不好，無財，失利。作塭防風水，失，虧本。魚苗待機可以。月令正月至六月止。尋人難。免望。遠信音息魚沉。<p>• 古人：撐渡伯行舟遇太歲　三藏被紅孩兒燒' },
            { number: 14, poem: '財中漸漸見分明，<p>花開花謝結子成，<p>寬心且看月中桂，<p>郎君即便見太平。', story: '桃園三結義', explanation: '財運來臨漸漸顯明，正像那花開花謝後，結成滿樹的果實，不必焦急，且寬心等待中秋節到來，你所等待的郎君，將回來與你共渡那太平愜意的日子。 <p>【求得此籤】 <p>問事求謀 ,宜求觀音菩薩祈福可得圓滿 . <p>如問事業，表示已有轉機，財運也將慢慢到來即使目前財利不顯，但只要耕耘，必有收穫。只怕不肯用心努力，隨世浮沉，就像那花開花謝，月亮盈虧，得失相伴。 <p>問功名，也是一樣，如果不去充實自己，只想碰運氣，是難得有成就的。<p>問婚姻，有情人終成眷屬，婚姻可成。 <p>問訴訟，只要出於至誠，必能平安無事，能破財消災。 <p>問疾病，危險有陰邪元辰暗淡，宜消災。<p>• 凡事大吉。作事決意成功。家事光前裕后，可喜。家運平安。婚姻成好。求兒平正。六甲先男後女，富貴。求財月光進，漸暗少。功名可喜。歲君中和。治病險，月光過不畏。出外不可（必得貴人）。經商漸得。來人月尾到。行舟月圓過大吉。移居吉（不可）。失物西方尋，月光在，月暗無。求雨月半無，月尾有。官事破財後，完明。六畜大吉。耕作早晚有收成。築室子孫永發其昌墳墓得其地，後大吉。討海月光過，大吉。作塭先微，後有大利。魚苗大利。月令頭破錢，後如意。尋人月中至。遠信速至。<p>• 古人：桃園三結義　曹操賜雲祥馬袍贈金銀。' },
            { number: 15, poem: '八十原來是太公，<p>看看晚景遇文王，<p>目下緊事休相問，<p>勸君且守待運通。', story: '渭水河太公釣魚', explanation: '姜太公到八十歲，仍然懷才不遇，只好衣渭水河釣魚等待時機，一直等文主聽到他的賢名，來拜訪他，才時來運轉，受到文王的重用，你目前的情況，跟姜太公的遭遇一樣，請不必多問，勸你學姜太公的作法，等待運氣亨通時。<p>【求得此籤】 <p>目前 機緣不足，問事求謀總不如意，但別灰心，這不是因你不夠努力，而是時機未到，目前最重要的是充實自己，只要虔誠禮敬神佛，必有加速轉運被重用的時候，絕不會被埋沒的。 問功名，不必焦急，你是屬於大器晚成型。問移居或職位變動，還不是時機，一動不如一靜。 <p>出外旅行，無利可圖。<p>問訴訟，以和為貴。<p>問婚姻，多屬晚婚。<p>問疾病，十日內危險有陰邪元辰暗淡，宜消災。<p>• 凡事大破財，求解和。作事難成。家事平平。家運平平。婚姻配偶慢成。求兒不可。六甲先女後男（先男後女）。求財晚即發。功名難就。歲君先平後吉。治病求平安，十日險。出外慢日可行。經商漸且候時。來人月尾有。行舟不如意，有事。移居待時。失物緊尋得，遲者無。求雨不日到。官事不吉。求貴人和。六畜漸且退步。耕作無收。築室漸且退步。墳墓遲必發。討海無財和者吉。作塭無望。魚苗且守慢至。月令不遂。尋人不可急。遠信遲延。<p>•古人：渭水河太公釣魚　武吉挑柴打死人（武吉遇師） ' },
            { number: 16, poem: '不須作福不須求，<p>用盡心機總未休，<p>陽世不知陰世事，<p>官法如爐不自由。', story: '李世民遊地府', explanation: '每個人的福份是與生俱來的，不須刻意追求，也不須去製造，你雖然用盡心機去追求，結果還是失望，因為活在陽世間的人，不能明白陰間裏善惡果報的事，而你的福份是你前世為善的因果。ㄧ個人在生前所做所為，往生後到陰間，都要接受審判。作惡多端的人，要下地獄受苦行，一點都由不得你有自由意志。<p>【求得此籤】 <p>暗示目前福報已盡 ,問事求謀難成 .切忌再有感情用事 . 機謀報復憤恨詛咒....等損德之事應該佛前懺悔並多行善事積德來感動神明與別人<p>問目前運途，浮沉不定。<p>問功名 難有進展。<p>問婚姻，緣份未到。<p>問移居外出，均不吉，一動不如一靜。<p>問訴訟，須修心，不可意氣用事，得饒人處且饒人，總要以和為貴。<p>問疾病，危險有陰邪元辰暗淡，宜消災。<p>• 凡事恐防風波災。作事退步。家事恐防有變。家運陰邪，求神解決。婚姻不合，有鬼作怪。求兒不可。六甲先男後女（子媳虛）。求財春夏好秋冬呆。功名難得。歲君浮沉。治病必危，有陰公作祟。未日（半月）過不畏。出外防險。經商難就，了錢。來人遲慢。行舟不如意，惹失。移居不可。失物難尋，未日（半月）在。求雨不日到。官事緊防刑事。六畜不可納。耕作無收。築室不可。墳墓地勢不佳。討海有陰鬼，難得。作塭難如意，要忍耐。魚苗失利難如意。月令了錢。尋人遲慢。遠信必有失音。 ' },
            { number: 17, poem: '舊恨重重未改為，<p>家中禍患不臨身，<p>須當謹防宜作福，<p>龍蛇交會得和合。', story: '薛剛大鬧花燈跌死太子驚死聖駕', explanation: '回憶往事心頭舊恨重重疊疊無法消除，就好像家中發生災禍，雖然沒有降臨到本身，但是造成的傷害卻綿綿無盡期。你要謹慎提防其他事故發生，最好多作好事，只要多種福田，必能逢凶化吉，而且在辰已交會時刻，一定會得到很圓滿結果。<p>【求得此籤】 <p>不斷努力去做，改過遷"善.必定有出人頭地的一天問事求謀難成 . 告訴求籤者，必須佛前懺悔自省檢討以前犯的錯誤 , 改變作為避免再犯相同或類似的錯誤而且不論經歷多少次的失敗，辛酸，無數次的恨事，都要不灰心，問事求謀，此籤有貴人助，但必須 謙虛求教，籤詩言:「須當謹防宜作福。」要防事故反覆發生必須多求神問禱來作福, 才能得神佛及貴人之助逢凶化吉，並得天賦"奇"運。<p>問功名，只要準備充分，即使遭受挫折，算不得什麼，再次必中第。<p>問婚姻，緣份巳到，婚姻可成。<p>問出外，不吉無利可圖。<p>移居，隨意可行。 <p>問疾病，求神自安 , 醫遇貴人。<p>• 凡事人害緊，和無事。作事先難後易。家事和為貴。家運居之則安。婚姻大吉。求兒不可。六甲先男後女。求財勤儉必得。功名修陰德必中。歲君淡淡。治病求神庇祐，辰未日（半月）過漸癒。出外辰巳日則可。經商平平。來人辰未日（半月）到。行舟平平，財輕。移居隨意，不可。失物辰巳日在，難尋。求雨初初到尾。官事和為貴，不和凶。六畜納者不可。耕作平平，少利。築室有犯陰邪。墳墓平平，小吉。討海微利運不辰。作塭運不合，求小利。魚苗微利。 27月令不畏。漸漸平安。尋人待時。遠信慢。' },
            { number: 18, poem: '君問中間此言因，<p>看看祿馬拱前程，<p>若得貴人多得利，<p>和合自有兩分明。', story: '秦叔寶救唐公李淵搬家', explanation: '如果你問這中間的因果，請看看「祿馬貴人」幫助你前程的發展，就可領悟出事情的前因後果。如果你能得到貴人的幫助，自然會一切順利，一切都能圓滿融和。<p>【求得此籤】 <p>問功名，這是大吉之兆，可以積極去發輝，表現你的才能，你未來前程光明遠大，自不在話下。<p>問婚姻，只要兩情相悅，婚談必可有情人終成眷屬 . 如果年屆中年仍未婚，必定能在近期獲得佳音。<p>移居，出外，行船，凡事求和，均吉。<p>此籤惟問疾病不吉，男無妨女危險求神漸漸痊癒。<p>凡事忍耐求和。作事貴人利，和氣成。家事圓滿進財。家運瑞氣盈庭。婚姻大吉。求兒月光好，月暗平。六甲先男。<p>求財不多。（萬金萬貫連得）。功名有望。歲君得利。治病痊癒。出外有貴人提攜。經商大進利市。來人月光到。行舟得財。移居大吉。失物月光在。求雨不日即到。官事速和公判。六畜可好。耕作有收。築室祥氣盈庭。墳墓福人必得福地。討海和者得大財。作塭獲利三倍。魚苗大利。月令平安吉慶。尋人在。遠信佳音速報。' },
            { number: 19, poem: '富貴由命天註定，<p>心高必然誤君期，<p>不然且回依舊路，<p>雲開月出自分明。', story: '紅孩兒捷住路頭', explanation: '俗語說：「富貴在天，生死由命」一個人的窮通禍福，富貴貧賤，都是上天安排命裏註定的，所謂「命裏有時終須有，命裏無時莫強求」如果你期望太高，必定會大失所望，而且耽誤了你的佳期，既然此路不通，何不回頭走舊路，說不定還能撥雲見月，見到光明的遠景呢！<p>【求得此籤】 <p>求得此籤暗示目前福報不夠，問事求謀，只宜安分守舊，不可意氣勉強。<p>問事業，創新不吉，守舊安泰。<p>問求財，不多，財多則身弱，反為不吉。<p>功名難得，婚姻平平。<p>移居出外，均不吉。<p>問疾病，危險有陰邪元辰暗淡，宜消災。 <p>• 凡事被人害，理完（終）明。作事月光好。家事和而貴，犯相剋，望神佛。家運不佳，可住平安。婚姻不成，由天註定。求兒慢一步。六甲先女後男，得貴，作福出麟兒。求財守機而作。功名難得。歲君照舊。治病險，月光好，若暗不癒。出外不可。經商難如意，守待時。來人月頭到。行舟平平。移居可。失物月光在，暗難尋。求雨未有。官事命運犯刑相剋，拖尾。六畜不可。耕作不可依舊。築室不可。墳墓舊墳重興。討海運微不逢時。作塭守運心亦虧本。魚苗應月明。月令桂候。尋人暫待。遠信將近就至。' },
            { number: 20, poem: '前途功名未得意，<p>只恐命內有交加，<p>兩家必定防損失，<p>勸君且退莫咨嗟。', story: '孫悟空大難火災', explanation: '前途功名未能得意發展，恐怕是因為命裡還有交錯坎坷的運氣，家庭不可分兩家，如果分兩家一定會有損失，必須防備，所以勸你還是退守本分，不必唉聲嘆氣。<p>【求得此籤】 <p>暗示目前福報不佳，問事求謀，不可意氣逞強鬥狠。<p>問財運，到目前，都不能如願，前手來後手空，不宜過份強求，須防破財或劫財。<p>問婚姻或家庭運，均不吉，婚姻 慎防美人計 , 若非兩廂情願，不易成功，婚姻須防反目成仇。<p>問功名，還須多用功充實，明年機會較大。<p>出外做事，移居，均不宜妄動。<p>問疾病，孕婦臨產危險，老人及婦女危險 , 宜求神消災解厄。<p>• 凡事了錢，拖尾，不合。作事無成。家事恐生孽物。家運防邪怪作之災。婚姻難合。求兒不可。六甲臨產危險。求財不得。功名科運無，難進中。歲君坎坷。治病大命險，未日（半月）好。出外無運，不可。經商不就。來人未日（半月）到。行舟失利。移居不可。失物不得了工。求雨無。官事拖尾破財。六畜不合。耕作難收。築室不得完美。墳墓不可葬，地不合。討海有陰公作祟。作塭命運蹉跎，無望。魚苗失了資本。月令陰邪作病，難遂。尋人延緩。遠信音信沉沒。' },
            { number: 21, poem: '十方佛法有靈通，<p>大難禍患不相同，<p>紅日當空常照耀，<p>還有貴人到家堂。', story: '朱壽昌尋母在長亭', explanation: '十方世界佛法無邊，神通廣大靈通精深，只要你信仰虔誠，即使遭遇大難禍患，結局自亦不同，所謂「吉人天相」自然逢凶化吉，化險為夷，何況陽光普照之下，又有「貴人」到家裏保佑你。<p>【求得此籤】 <p>暗示當事人有佛緣，問事求謀會得觀音菩薩相助。<p>但須有堅強的耐性 . 問求財，先難後易。<p>問功名，能修善，自有神助。<p>問婚姻，有媒可成。<p>問訴訟，先凶後吉。<p>問出外或移居，平平。<p>問疾病，病情加重 ,老人及婦女危險 , 宜求神消災解厄。<p>• 凡事貴人扶持。作事和大吉，散得失。家事門庭可恭可賀。家運必得吉昌。婚姻難成。求兒好。六甲先男後女。求財先無後有。功名望後科。歲君中和。治病大命險，貴人扶。出外緩有貴人。經商先難後吉。來人立即到。行舟無大利。移居適宜大吉。失物可在。求雨緩到。官事微殃，有貴人，脫。六畜納之可喜。耕作平平晚收。築室必有餘慶。墳墓顯裕後昆。討海先微，后有大利。作塭有利可得。魚苗慢則有財。月令平后，有貴人，吉，尋人在。遠信速至有喜。' },
            { number: 22, poem: '太公家業八十成，<p>月出光輝四海明，<p>命內自然逢大吉，<p>茅屋中間百事亨。', story: '周文王為姜子牙拖車', explanation: '姜太公到八十歲才成家立業，你何必急呢﹗一個人的機會一到，就像那雲開月出一樣，光輝普照大地，大放光明，命中時機若到，自然飛黃騰達，大吉大利。在時機未到前，就暫時隱守在家裡等候吧﹗這樣反可以百事順利。 <p>【求得此籤】 <p>問事求謀之時機未到，必須等待。<p>一個人如果機會未到，硬要強出頭，只是自尋煩惱。<p>像姜太公雖是一位人才，但到八十歲遇到文王，才有表現的機會，你可能也是屬於大器晚成型的人。此籤問事業，目前尚不如意，但只要持之以恆，努力充實自己，必有被重用的一天。問求財，財運不多。<p>問婚姻，有情人終成眷屬。問出外移居，尚可。<p>問疾病，幼,婦人危險宜消災。<p>• 凡事先呆，得貴人吉。作事先呆後吉。家事門庭吉慶。家運安居春風。婚姻和合。求兒平正。六甲生男，子媳虛。求財先微後進。功名晚可有進。歲君順利。治病老不畏，少不好。出外平平。（有貴人提攜，得利）。經商有利益。來人月光到。行舟晚運可通。移居好。失物月光在，月暗無。求雨上下弦。官事和合好（貴人了錢，完局）。六畜納有利。耕作允好。築室百事吉慶。墳墓有餘裕哉。討海先無後利。作塭晚者大利。魚苗有利可得。月令不遂。尋人慢至。遠信音' },
            { number: 23, poem: '欲去長江水闊茫，<p>前途未遂運未通，<p>如今絲綸常在手，<p>只恐魚水不相逢。', story: '明朝海瑞安南討貢封王', explanation: '想要到長江邊去垂釣，但只見汪洋一片，使人感到前途茫茫，不知何去何從，手拿著釣竿，在江邊耐心的等待，只恐怕魚兒與這江水無緣，不會來了。此籤用魚水來比喻君臣之相得，也用來比喻夫婦的相愛。用垂釣象徵求取名利。<p>【求得此籤】 <p>問事求謀難成 ,目前你的福報不佳及方法錯誤，必須屏棄過去，誠意正心禮佛懺悔行善事作公益來造福。<p>並改變作為與想法。才能雨水相逢信有神. 用釣魚，表示求取緣份及名利。 問婚姻，不可執著墨守成規，空等待，改變追求的方法才能成功。問功名，有懷才不遇之感，還要等候時機，除非改變自己想法做法否則難有作為。<p>問財利，目前不理想。<p>問出外，無利可圖。<p>問移居，須待時機來改變環境。<p>問疾病，未安了錢，宜求神消災解厄。<p>凡事不可作，和者吉。作事遲緩。家事門庭失運，了錢。家運崎嶇不順。婚姻大吉。求兒不可。六甲生男（子虛，先女後男）。求財先失運，後有利。功名無望。歲君順利。治病了錢，尾過漸好。出外不可。經商顛倒。來人未日（半月）到。行舟運途不佳。移居不佳，等待，失物尋不見。求雨上下弦。官事尾勝吉（了錢完局）。六畜不可納。耕作不合時運，微利。築室不可，且慢。墳墓地氣不佳。討海運途不佳。作塭防魚失，求微利。魚苗後日可得小利。月令不遂。尋人緩。遠信音信無到。' },
            { number: 24, poem: '月出光輝四海明，<p>前途祿位見太平，<p>浮雲掃退終無事，<p>可保禍患不臨身。', story: '秦叔寶救李淵', explanation: '月亮放出了光輝，天下四海皆受其普照而光明，世人仰望其光彩。運途從此平順，不論是前程或祿位只見一片錦繡。那如浮雲遮月的日子已經過去了，坎坷的運途就像烏雲一般被一掃而空。從此太平無事，可以不必再擔心會禍患臨身了。<p>【求得此籤】 <p>問事求謀難成 , 需求神作福多行公益增加福報暗示先苦後甘有志者事竟成，天下沒有不勞而獲的事。這是一首"苦盡甘來"的籤詩。<p>有一分耕耘，必有一分收穫。過去艱苦的奮鬥，終於發出勝利的光輝<p>問功名，只要有實學，必可高中，不愁沒有職位，只怕缺乏才能。<p>出外，移動，都有利可圖。<p>問財運，小財有，要想發大財，尚須靠機會。<p>問疾病，男無妨女危險有陰邪元辰暗淡，宜消災。<p>• 凡事緊和平，了錢工。作事月光即成。家事大進圓滿。家運平安。婚姻和合。求兒好。六甲先男，（先女後男）。求財少有。功名顯榮祖宗，恐有變。歲君中和。治病陰邪祟。求神安。出外先少利，後可得。經商無利。來人月光到。行舟財輕，平平。移居后即可以。失物月光在，月暗無。求雨未有。官事冒險，有貴人。好。六畜可納。耕作平正。築室漸且候，待日期。墳墓后大吉。討海無大財，陰作祟。作塭途中防水微利。魚苗先微后有。月令不遂。尋人可回。遠信佳音速至。' },
            { number: 25, poem: '總是前途莫心勞，<p>求神問聖枉是多，<p>但看雞犬日過後，<p>不須作福事如何。', story: '劉文良別妻', explanation: '前途有命運安排，你只要盡其在我去努力奮鬥，不必勞心去求神問卜，那只是多枉費精神，你要解決的事，只要等待酉、戌日過了以後就會有消息的，不必再去祈福求神。<p>【求得此籤】 <p>朱雀當道，最不利感情事，主是非糾葛難判明。<p>天狗當道，走狗屎運，主晦氣連連。此籤暗示目前福報不佳 <p>問事求謀守則安，一動不如一靜<p>故問出外移居，均不好<p>問功名，惟有靠自己多努力，靠運氣或神祐，是沒有希望的。<p>如果沒有充分的準備，金榜題名的希望不大。<p>問婚姻， 朱雀擾人，防詐騙，私情，外遇，口角爭端.....等，愛恨恩怨，是非對錯，真假難辨明，必須要確定雙方是否"真愛"，如果情投意合，則可成。<p>問疾病，危險有陰邪元辰暗淡，宜消災。<p>• 凡事作可作，和者吉。作事慢成。家事平平。家運宅舍難居。婚姻不好難成。求兒不可。六甲謝良愿，求神佛。求財微利不吉。功名未就，歲君中和。治病運深，酉戌不畏。出外不可。經商新業差，舊業平。來人戌日到。行舟財輕微利。移居且慢。失物己丑卯戌日在。求雨甲子乙丑日，不久。官事宜和（必受災殃）。六畜不可。耕作只收半。築室不美，成者安。墳墓地勢不合。討海和者好，不和呆。作塭只求微利。魚苗小利。月令下半年平安。尋人慢至。遠信音信遲' },
            { number: 26, poem: '選出牡丹第一枝，<p>勸君折取莫遲疑，<p>世間若問相知處，<p>萬事逢春正及時。', story: '范丹洗浴遇賢妻', explanation: '在代表富貴榮華的牡丹花中，選出最漂亮的那一朵花來，奉勸你有漂亮的花朵可以摘取時，就把握機會把它採摘下來，不要懷疑和遲疑。如要尋問世間知音在何處，萬般事情遇到春天都是好時機，一切行事須及時，莫待春去再來惆悵懊悔。<p>【求得此籤】 <p>求得此籤暗示目前福報圓滿 ，<p>問事求謀可期 , 應及時把握良機 ..<p>問求財，有財運，但須把握機會。<p>出外，移居，動則有利。<p>營謀做事，要積極主動，不可猶豫不決。<p>問婚姻，天賜良緣，婚姻可成。<p>問疾病，男無妨女危險求神漸漸痊癒。<p>• 凡事春吉冬呆。作事春天可成。家事綿綿齊美。家運安居春風。婚姻成者好。求兒平平。六甲先男後女。求財財源廣進。功名朱衣點頭（及第）。歲君順吉。治病平安（婦忌十一月男能十二月，老危少安）。出外平安有，春滿載，經商逢春發無窮。來人月光到。行舟財利平平。移居平安。失物在東方，緊尋在。求雨必到。官事必和，必勝。六畜可納。耕作早冬好，下冬呆。築室逢春大吉。墳墓真龍正穴。討海春有冬無。作塭逢春利，外微利。魚苗三月吉四月小吉。月令不遂。逢春如意。尋人月前得回。遠信源源而來。' },
            { number: 27, poem: '君爾寬心且自由，<p>門庭清吉家無憂，<p>財寶自然終吉利，<p>凡事無傷不用求。', story: '胡完救文氏母女', explanation: '奉勸你不必為了俗事而焦慮操心，應該寬心自由自在地生活。<p>只要在家裡平安無事，財利自然源源而來。<p>凡事命裏有時終須有，命裏無時莫強求。<p>任何事情，不必強求讓其順其自然最好。<p>此籤告訴當事人，一切聽從命運安排，不必憂慮操心。<p>【求得此籤】 <p>問事求謀可期，吉人天相無須多慮，<p>問財利，憑各人財運大小，不要妄求。<p>問功名，且寬心等待，必有其成功發展的一天。<p>問婚姻，耐心的等待。<p>不可操之過急，而且要誠心誠意，合和圓滿。<p>問疾病，求神漸漸痊癒。<p>• 凡事有財允成，不畏。作事成功。家事團圓且喜。家運可得興旺。婚姻大吉。求兒不可。六甲添得弄璋之喜。求財先輕後得。功名晚到。歲君淡淡，未安。治病得安。出外先呆後好。經商獲如意，後大利。來人難在。行舟先平安後大進。移居慢即吉。失物自回。求雨尚未有。官事有貴人，平安，六畜興旺。耕作早冬微，晚冬好。築室喜得瑞氣盈門。墳墓地運大進益。討海先無後有。作塭免介意，有利得。魚苗先微后有。月令平安。尋人不見，難尋。遠信佳音速至。' },
            { number: 28, poem: '於今莫作此當時，<p>虎落平陽被犬欺，<p>世間凡事何難定，<p>千山萬水也遲疑。', story: '李存孝打虎', explanation: '英雄好漢莫提當年勇，此一時彼一時，不要將現時仍與當年比，就像那老虎一落到平地裡，英雄無用武之地，連平地小狗都敢欺負他。世間上的事情，有什麼難於決定的呢？就是千山萬水的困難，也不必遲疑，就決定勇往直前吧﹗<p>【求得此籤】 <p>求得此籤天狗當道，走狗屎運，主晦氣連連。<p>問事求謀，委屈受辱凡事拖尾難成 ，人力難回天，當思求神作福補祿<p>問財利，應該積極進取，歷千山萬水辛苦得來。<p>若問功名，此籤有才能而不遇，就像「虎落平陽」，英雄無用武之地。<p>問婚姻，此籤最不利感情，恐遇大阻礙或委屈受辱，難於和合，宜另找適當的對象，不可執迷而自取其辱。<p>移居．出外均不可。<p>問疾病，運逢白虎落難防意外危險有陰邪元辰暗淡，宜解厄消災。<p>問官司，防意外之官非，委屈受辱，被官欺。<p>• 凡事後成吉。作事難成。家事恐防大害。家運人作怪，恐風波。婚姻不吉，女帶殺氣。求兒不可。六甲須防難產。求財不得。功名無。歲君平平。治病運犯劫，被邪欺，寅戌日過不畏。出外被人欺。經商呆人欺，難如意。來人難在。行舟無利可得，了財帛。移居大不好。失物難尋。求雨不日到。官事被官欺，大了錢。六畜不安。耕作半收。築室不可，犯殺。墳墓犯六十年，緊移。討海無利可得。作塭剋口舌，忍耐好。魚苗不利。月令九不畏，防人欺。尋人難得。遠信魚沉消息。' },
            { number: 29, poem: '枯木可惜逢春時，<p>如今還在暗中藏，<p>寬心且守風霜退，<p>還君依舊作乾坤。', story: '古城會關公斬蔡陽', explanation: '樹木枯萎了，很可惜時機未到，現在還是寒冷的嚴冬，轉眼是春天的季節，枯木能逢春，自然生意盎然，但現在只有在暗中等待機會，你不必太心急，且寬心地等待，直到風霜退了，春天自然來到，你仍然有春光明媚的境界了。<p>【求得此籤】 <p>求得此籤暗示 ,當事人有佛緣 ,問事求謀可期,會得觀音菩薩相助 ,象，表示你目前遭遇困難 , 觀音菩薩都有暗中關注與幫忙，成事在天,謀事在人 ,成事需要機緣與定數 . 等待機緣成熟，接著就是平坦的康莊大道了。<p>此籤有否極泰來之意<p>問財，漸入佳境。<p>問功名，時機未到，尚須埋頭苦讀。<p>問婚姻，成功的機率渺茫，只得暫時等待。至於這樁婚事的好壞，乃先苦後甘之象。<p>移居、出外，暫不宜。<p>問疾病，命危險有陰邪元辰暗淡，宜消災。<p>• 凡事待時。作事難成。家事平安。家運合家興旺，運滯。婚姻平平。求兒不吉。六甲先男後女。求財新業差，舊業平。功名不就。歲君平正。治病運暗，逢春出運，老凶。出外不可。經商須守安命不可。來人未日（半月）到。行舟無利可得。移居不吉。失物援尋（必在）。求雨久不至。官事拖尾。六畜不可。耕作無利半收。築室漸待開春。墳墓地運後必發。討海依舊吉，新不利。作塭返原運，暗無利。魚苗春有利，夏失時。月令不遂。尋人行人待。遠信音信速至出' },
            { number: 30, poem: '漸漸看此月中和，<p>過後須防未得高，<p>改變顏色前途去，<p>凡事必定見重勞。', story: '薛丁山三請樊梨花', explanation: '事情會慢慢變化，但這個月中還不致有太大的變化，然而過了這個月，就要防患未然，不可好高騖遠，以免失望，你要改變一下作法，再向前途邁進，否則徒勞無功，白費心機<p>【求得此籤】 <p>此籤有改變目前想法與做法的意思，暗示目前福報不佳。<p>問事求謀，要有重新來過的準備。<p>問求財，微利可取， 難奢望大利，恐白費精神。<p>問功名，成功希望渺小。<p>問婚姻，坡折重重求神解，要有薛丁山三請樊梨花的誠意與毅力之心理準備。<p>出外、移居，均不宜。<p>問疾病，命危險有陰邪元辰暗淡，宜祈神消災。<p>• 凡事了錢，甚不好。作事難成。家事門有險，了錢災。家運了錢難安。婚姻不成。求兒不可，且慢。六甲空孕，勿躁。求財無利。功名不成難進。歲君不遂。治病險，半月不癒，重。出外不可出。經商經營不就。來人月光到。行舟了工了本。移居不可。失物難尋。求雨久不至。官事枉費了錢。六畜不佳。耕作了工後，半年好。築室不安。墳墓地氣不佳。討海了工，無利。作塭枉費徒勞，失利。魚苗無望。月令不遂。尋人行人漸回。遠信音信有變。' },
            { number: 31, poem: '綠柳蒼蒼正當時，<p>任君此去作乾坤，<p>花果結實無殘謝，<p>福祿自有慶家門。', story: '孟姜女招親', explanation: '正是楊柳蒼翠成蔭的時候，你應該把握時機，好好去闖天下，開展你的事業，好好耕種，自然會開花結果，天下是沒有不勞而獲的，一分耕耘，一分收穫，積善之家，必有餘慶，好好播種心田，福祿自然滿家門<p>【求得此籤】 <p>求得此籤暗示目前福報俱足，問事求謀可期 ,若能更多行善公益 , 福祿更圓滿。<p>問事業:只要埋頭苦幹，必能成大業，<p>此籤具有蓄財(花果結實)繁榮(綠柳蒼蒼)等吉象，應好好把握。<p>問婚姻 應努力追求積極把握 問功名 有金榜題名之兆。<p>出外、移居，均大吉。<p>問疾病，求神自安 , 醫遇貴人。<p>是一首有大收穫的吉籤。<p>• 凡事得利。作事成功。家事瓜瓞綿綿。家運世世興旺。婚姻好結尾。求兒好。六甲先女後男（生男）。求財用心即有，春夏好，在家好。功名差人來報喜。歲君大吉。治病喜遇良醫。出外大吉可進。經商大發資財。來人立即到。行舟財發萬金。移居適其所哉。失物急尋可有。求雨及時。官事緊完局，了錢。六畜可納。耕作好。築室好。墳墓幸喜得遇其穴。討海財發萬金。作塭黃金萬貫可喜。魚苗見春可喜。月令不遂。尋人必在。遠信音信有回。<p>• 古人：孟姜女招親　董永皇都市仙女送孩兒' },
            { number: 32, poem: '龍虎相交在門前，<p>此事必定兩相連，<p>黃金忽然變成鐵，<p>何用作福問神仙。', story: '劉備入東吳進贅', explanation: '龍和虎門前廝殺，戰的你死我活，到最終會導致兩敗俱傷。事情發生常有關連的，俗云「運來鐵成金，運去金成鐵」一切事情的發生，當然以和為貴，如果事事計較，天天與人勾心鬥角，祈求神佛賜福亦無用<p>【求得此籤】 <p>暗示目前福報將盡 , 問事求謀拖尾難成 ,應靜守多行善作福 . 避免魯莽意氣用事而再生禍端<p>問功名，成績無，須再充實自己。<p>移居出外，均不得時，最好能三思後再決定。<p>問婚姻，龍虎相爭，感情不合。 宜忍耐牽就，家和才能萬事興。<p>問疾病， 運逢白虎當道防意外危險，病難癒拖尾，有陰邪元辰暗淡，宜解厄消災。<p>凡事退卻。作事難得成功。家事恐遇風波之災。家運多口舌之災。婚姻不吉。求兒不可。六甲防小產，子息虛。求財失利虧本。功名無望。歲君中和，不遂。治病有邪凶險，拖尾，少者好，寅辰日不畏。出外不可，犯災難。經商了錢。來人寅辰日到。行舟無利，了工。移居大不好。失物難尋。求雨不日到。官事了錢拖尾。六畜損失。耕作不可。築室必退敗。墳墓地氣漸失。討海徒勞。作塭失運虧本。魚苗不可。月令不遂。尋人寅辰日在。遠信音信遲至。<p>• 古人：龍處交會　劉備入東吳進贅' },
             // 以下籤詩全錯，繼續填入其他籤詩，並為剩餘的使用 placeholder 解說              
            { number: 33, poem: '欲問功名喜及時，<p>泰來否極事徘徊，<p>鑽龜打卦空疑惑，<p>卻主平平待運來。', story: '未知', explanation: '此籤的解說待補充，請查詢媽祖靈籤相關資料。' },
            { number: 34, poem: '君問中間路若何，<p>如今早早把門關，<p>無事但把家人守，<p>千莫憂愁惹煩惱。', story: '未知', explanation: '此籤的解說待補充，請查詢媽祖靈籤相關資料。' },
